services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: transit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: transit_db
    ports:
      - "5432:5432"
    volumes:
      - transit_pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  transit_pgdata: