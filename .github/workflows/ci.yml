name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-test:
    name: Backend Build & Concurrency Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: transit_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache-dependency-path: backend/go.sum

      - name: Go Vet
        working-directory: ./backend
        run: go vet ./...

      - name: Go Build
        working-directory: ./backend
        run: go build ./...

      - name: Run Backend Tests & Concurrency Benchmarks
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/transit_db?sslmode=disable
          TEST_DB_ADMIN_URL: postgres://postgres:password@localhost:5432/transit_db?sslmode=disable
          TEST_DB_APP_URL: postgres://app_user:app_password@localhost:5432/transit_db?sslmode=disable
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: production-grade-ci-test-secret-key-32b!
        run: |
          if ! go test -v -p 1 -count=1 ./... > test.log 2>&1; then
            cat test.log
            ERR_MSG=$(grep -C 5 -E "(FAIL|--- FAIL)" test.log | head -n 40 | tr '\n' ' ')
            if [ -z "$ERR_MSG" ]; then
              ERR_MSG=$(tail -n 25 test.log | tr '\n' ' ')
            fi
            echo "::error title=GoTestFailure::$ERR_MSG"
            exit 1
          fi

  frontend-typecheck:
    name: Frontend TypeScript Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify TypeScript Types (Strict Zero-Any)
        working-directory: ./frontend
        run: npx tsc --noEmit
